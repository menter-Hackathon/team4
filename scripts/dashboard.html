<!doctype html>
<!--
  ふたまるのダッシュボード（仕様 §6.6、#59）。scripts/dashboard.py が返す HTML 1 枚。
  「ふたまる診断の結果画面」: 育てた人ごとに、どんな性格に育ったかを一発で見せる（設計メモ 2026-11-20）。
  しくみ:
    1. 数秒ごとに /api/state（JSON）を読みに行き、Alpine.js のデータ（plants）に入れる
    2. 画面の形は下の HTML にそのまま書いてあり、Alpine.js がデータに合わせて中身を入れ替える
       （x-for: くり返す、x-if: 出す・出さない、x-text: 文字を入れる、:class・:style: 見た目を変える）
       株ごとのカードは上から
         結果（イラスト・タイプ名・キャッチコピー）→ せいかく（4 軸のゲージ）→ 説明文
         → こんなふうに育てられた（育て方の記録）→ くわしく（成長曲線・覚えていること・前回の会話）
    3. Alpine.js は変わったところだけを書き換えるので、3 秒ごとに読み直してもちらつかない
    4. 成長曲線のグラフだけは Chart.js が描く（Alpine.js の外で、JS から更新する）
  なぜ Alpine.js か: ビルドが要らず（CDN から読むだけ）、Docker もデモの手順も変えずに、
    「要素を 1 つずつ JS で作る」書き方から「HTML に書く」書き方にできるため（2026-11-20）。
  記憶や要約は LLM が作った文なので、必ず x-text で入れる（HTML として入れる x-html は使わない。タグを実行させない）。
  色・線・丸ゴシックは、ちゃむさんのイラスト（クリーム色の鉢・茶色の太い線）に合わせている。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ふたまる ダッシュボード</title>
<!-- 丸ゴシック（Google Fonts）。読めないとき（ネットが無いなど）は、Mac・Windows にある字体で出す -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<!-- グラフ描画ライブラリ（外部の技術。README に記載）。版を固定する。成長曲線にだけ使う -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    /* イラストから取った色 */
    --bg: #f6f0e6;        /* 画面の地（鉢のクリーム色より少し暗い） */
    --paper: #fffaf1;     /* カードの地（鉢のクリーム色） */
    --ink: #4a3426;       /* 文字（イラストの線の茶色） */
    --line: #5b3a26;      /* 太い線 */
    --sub: #8a6a55;       /* 補足の文字 */
    --soft: #f1e6d8;      /* ゲージの溝・区切り */
    --cheek: #e58fa0;     /* ほっぺのピンク */
    --display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif;
    --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif;
  }
  * { box-sizing: border-box; }
  /* hidden を付けた部品は必ず隠す（display: grid などの指定より優先させる） */
  [hidden], [x-cloak] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.7; }
  header {
    display: flex; align-items: baseline; gap: 6px 16px; flex-wrap: wrap;
    padding: 20px 24px 4px; max-width: 1240px; margin: 0 auto;
  }
  header h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 26px; color: var(--line); }
  header .status { color: var(--sub); font-size: 13px; }
  header .status.error { color: #b3261e; font-weight: bold; }
  main {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    gap: 20px; padding: 12px 24px 32px; max-width: 1240px; margin: 0 auto;
  }

  /* 株 1 つぶんのカード。--k が株ごとの差し色、--kl がその薄い色 */
  .card {
    background: var(--paper); border: 3px solid var(--line); border-radius: 30px;
    overflow: hidden; min-width: 0;
  }
  .card .bar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 3px solid var(--line); background: var(--paper);
  }
  .card .bar h2 { margin: 0; font-family: var(--display); font-size: 15px; color: var(--sub); font-weight: 700; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tabs button {
    font-family: var(--display); font-weight: 700;
    border: 2px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 2px 12px; font-size: 13px; cursor: pointer;
  }
  .tabs button.on { background: var(--k); color: #fff; }
  .tabs button:focus-visible { outline: 3px solid var(--cheek); outline-offset: 2px; }

  /* 1. 結果 */
  .result { background: var(--kl); text-align: center; padding: 14px 18px 18px; border-bottom: 3px solid var(--line); }
  .result .owner { font-family: var(--display); font-weight: 700; color: var(--sub); font-size: 15px; }
  .result .lead { font-size: 14px; }
  .result .pic {
    width: 200px; height: 200px; margin: 0 auto; display: flex; align-items: center; justify-content: center;
    font-size: 120px; line-height: 1;
  }
  .result .pic img { width: 200px; height: 200px; object-fit: contain; }
  .result .tname { font-family: var(--display); font-weight: 800; font-size: 32px; color: var(--line); line-height: 1.25; }
  .result .catch {
    display: inline-block; margin-top: 8px; background: #fff; border: 2px solid var(--line);
    border-radius: 999px; padding: 3px 16px; font-family: var(--display); font-weight: 700; font-size: 14px;
  }

  .body { padding: 16px 20px 22px; display: grid; gap: 18px; }
  h3 { margin: 0 0 6px; font-family: var(--display); font-size: 14px; color: var(--sub); letter-spacing: .04em; }

  /* 2. せいかく（4 軸のゲージ。真ん中 = 0.5 から、育った側へ棒が伸びる） */
  .axis {
    display: grid; grid-template-columns: 6em 1fr 6em; align-items: center; gap: 8px;
    font-family: var(--display); font-size: 14px; font-weight: 700; margin-top: 8px;
  }
  .axis .hi { text-align: right; }
  .axis span { color: #bba796; font-weight: 500; white-space: nowrap; }
  .axis span.on { color: var(--k); font-weight: 800; }
  .track { position: relative; height: 14px; background: var(--soft); border-radius: 99px; }
  .track::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: #d6c2ad; }
  .track i { position: absolute; top: 0; bottom: 0; background: var(--k); border-radius: 99px; transition: left .6s, width .6s; }

  /* 3. 説明文 */
  .detail { margin: 0; font-size: 15px; line-height: 1.9; }

  /* 4. こんなふうに育てられた */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stats div { background: var(--kl); border-radius: 16px; padding: 8px 6px; text-align: center; }
  .stats b { display: block; font-family: var(--display); font-size: 24px; color: var(--line); line-height: 1.3; font-variant-numeric: tabular-nums; }
  .stats small { font-size: 12px; color: var(--sub); }
  ul.facts { margin: 10px 0 0; padding-left: 1.2em; font-size: 14px; }
  .empty { color: var(--sub); font-size: 14px; }

  /* 5. くわしく */
  .more { border-top: 2px dashed var(--soft); padding-top: 14px; display: grid; gap: 14px; }
  .more .chart { position: relative; height: 230px; min-width: 0; }
  ol.mem { margin: 0; padding-left: 22px; font-size: 14px; line-height: 1.6; }
  ol.mem .tag { font-size: 11px; color: var(--sub); margin-left: 6px; white-space: nowrap; }
  .meta { font-size: 14px; line-height: 1.7; }
  .meta .k { color: var(--sub); margin-right: 6px; }
  .notfound { color: var(--sub); padding: 24px 20px; }

  @media (max-width: 720px) {
    header { padding: 16px 16px 4px; }
    main { grid-template-columns: 1fr; padding: 12px 16px 24px; }
    .result .pic, .result .pic img { width: 160px; height: 160px; }
    .result .tname { font-size: 26px; }
    .axis { grid-template-columns: 6em 1fr 6em; font-size: 12px; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) { .track i { transition: none; } }
</style>
</head>
<body>
<div x-data="dashboard">
  <header>
    <h1>ふたまるたちの育ったすがた</h1>
    <span id="status" class="status" :class="{ error }" x-text="status">読み込み中…</span>
  </header>

  <main id="plants" x-cloak>
    <!-- 株 1 つぶんのカード。:key で株を見分けるので、読み直しても同じカードが使い回される -->
    <template x-for="c in cards" :key="c.plant.plant_id">
      <section class="card" :style="accent(c.index)">
        <!-- 上の帯: 株の名前とタブ（お客さん・人ごと） -->
        <div class="bar">
          <h2 x-text="c.plant.found ? `${c.plant.name}（${c.plant.plant_id}）` : c.plant.plant_id"></h2>
          <div class="tabs">
            <template x-for="v in (c.plant.views || [])" :key="v.key">
              <button type="button" :class="{ on: v.key === selected[c.plant.plant_id] }"
                      @click="pick(c.plant, v.key)" x-text="v.person_id === null ? 'お客さん' : v.label"></button>
            </template>
          </div>
        </div>

        <template x-if="!c.plant.found">
          <div class="notfound">この株はまだ DB にありません（一度起こすと作られます）</div>
        </template>

        <template x-if="c.plant.found">
          <div>
            <!-- 1. 結果 -->
            <div class="result">
              <div class="owner" x-text="owner(c.view)"></div>
              <div class="lead" x-text="`${c.view.days} 日育てた結果…`"></div>
              <div class="pic">
                <!-- イラストがあれば画像、無ければ絵文字。src はサーバーが返した /types/<英語名>.png だけ -->
                <template x-if="c.view.type.image"><img :src="c.view.type.image" :alt="c.view.type.name"></template>
                <template x-if="!c.view.type.image"><span x-text="c.view.type.emoji"></span></template>
              </div>
              <div class="tname" x-text="c.view.type.name"></div>
              <div class="catch" x-text="c.view.type.description"></div>
            </div>

            <div class="body">
              <!-- 2. せいかく（4 軸のゲージ。真ん中 = 0.5 から、育った側へ棒が伸びる） -->
              <section>
                <h3>せいかく</h3>
                <template x-for="a in axes" :key="a.key">
                  <div class="axis">
                    <span class="hi" :class="{ on: gauge(c.view.traits[a.key]).hi }" x-text="a.hi"></span>
                    <div class="track"><i :style="gauge(c.view.traits[a.key]).style"></i></div>
                    <span class="lo" :class="{ on: gauge(c.view.traits[a.key]).lo }" x-text="a.lo"></span>
                  </div>
                </template>
              </section>

              <!-- 3. 説明文 -->
              <p class="detail" x-text="c.view.type.detail"></p>

              <!-- 4. こんなふうに育てられた（DB にある事実だけ。原因のようには書かない） -->
              <section>
                <h3>こんなふうに育てられた</h3>
                <template x-if="c.view.growth.talks === 0">
                  <div class="empty">まだお話ししていません</div>
                </template>
                <template x-if="c.view.growth.talks > 0">
                  <div>
                    <div class="stats">
                      <div><b x-text="c.view.growth.talks"></b><small>回お話しした</small></div>
                      <div><b x-text="c.view.growth.waterings"></b><small>回お水をもらった</small></div>
                      <div><b x-text="c.view.growth.time_band"></b><small>によく話しかけてくれた</small></div>
                    </div>
                    <ul class="facts">
                      <template x-for="f in facts(c.view.growth)" :key="f"><li x-text="f"></li></template>
                    </ul>
                  </div>
                </template>
              </section>

              <!-- 5. くわしく（今までのダッシュボードにあった情報） -->
              <section class="more">
                <h3>くわしく</h3>
                <!-- 成長曲線。Chart.js が描く（drawChart） -->
                <div class="chart"><canvas :id="`chart-${c.plant.plant_id}`"></canvas></div>
                <h3>覚えていること（大事で新しい順・上位10件）</h3>
                <template x-if="c.view.memories.length === 0">
                  <div class="empty">まだ何も覚えていません</div>
                </template>
                <ol class="mem" x-show="c.view.memories.length > 0">
                  <template x-for="(m, i) in c.view.memories" :key="i">
                    <li><span x-text="m.content"></span><span class="tag" x-text="memoryTag(m)"></span></li>
                  </template>
                </ol>
                <div class="meta">
                  <template x-for="row in metaRows(c.view)" :key="row[0]">
                    <div><span class="k" x-text="row[0]"></span><span x-text="row[1]"></span></div>
                  </template>
                </div>
              </section>
            </div>
          </div>
        </template>
      </section>
    </template>
  </main>
</div>

<script>
// 何秒ごとに読み直すか。デモで会話して眠らせた直後にゲージが動くのを見せるため短めにする
const REFRESH_MS = 3000;
// 性格 4 軸。hi は値が高い側（0.5 より上）、lo は低い側の呼び名。color は成長曲線の線の色
// 色は色覚の違いでも見分けやすい組み合わせ
const AXES = [
  { key: "talkativeness", label: "おしゃべり度", hi: "おしゃべり", lo: "ひかえめ", color: "#0072B2" },
  { key: "affection", label: "甘え度", hi: "あまえんぼ", lo: "クール", color: "#CC79A7" },
  { key: "energy", label: "元気度", hi: "げんき", lo: "まったり", color: "#E69F00" },
  { key: "curiosity", label: "好奇心", hi: "しりたがり", lo: "ききじょうず", color: "#009E73" },
];
const KIND = { preference: "好み", event: "出来事", habit: "習慣" };
const DIALECT = { standard: "標準語", kansai: "関西弁", hakata: "博多弁", hiroshima: "広島弁" };
// 株ごとの差し色（左: ひまわりのような暖色、右: 葉っぱの緑）と、その薄い色
const ACCENTS = [
  { k: "#d9822b", kl: "#fdf0d9" },
  { k: "#3f8f6c", kl: "#e3f2ea" },
];

// 成長曲線のグラフ（Chart.js）。{ plant_id: Chart }
// Alpine.js のデータには入れない。Alpine.js が中身を見張るしかけ（Proxy）と Chart.js がぶつかって壊れるため
const charts = {};

// 最初に開くタブを決める。views は先頭がお客さん、続いて登録された人（dashboard.py の plant_state）。
// 例: [お客さん, ショーン] → ショーンのタブ、[お客さん] や [お客さん, たろう, はなこ] → お客さんのタブ
function defaultView(views) {
  return views.length === 2 ? views[1].key : "guest";
}

// Alpine.js が動き出すときに、画面のデータと関数（x-data="dashboard"）を登録する
document.addEventListener("alpine:init", () => {
  Alpine.data("dashboard", () => ({
    axes: AXES,
    plants: [],      // /api/state の plants をそのまま入れる
    selected: {},    // 株ごとに選んでいるタブ。{ plant_id: "guest" | "person-1" ... }
    picked: {},      // 株ごとに、タブを押したことがあるか（押したら自動で切り替えない）
    status: "読み込み中…",
    error: false,

    // 画面ができたら 1 回読み、そのあと REFRESH_MS ごとに読み直す
    init() {
      this.refresh();
      setInterval(() => this.refresh(), REFRESH_MS);
    },

    // /api/state を読んで画面のデータを入れ替える。失敗しても次の回にまた試す
    async refresh() {
      try {
        const res = await fetch("/api/state", { cache: "no-store" });
        const state = await res.json();
        if (state.error) throw new Error(state.error);
        for (const plant of state.plants) {
          if (!plant.found) continue;
          const id = plant.plant_id;
          // まだ誰もタブを押していない間は、登録されている人が 1 人だけの株ならその人のタブ、
          // それ以外はお客さんのタブ。デモでは 1 株に 1 人（a1 はショーン、b1 はちゃむ）が育てるので、
          // 開いた直後からその人が育てた結果を見せるため。開いたあとに人が登録されたときも自動で切り替える
          if (!this.picked[id]) this.selected[id] = defaultView(plant.views);
          // 選んでいた人がいなくなっていたら（DB を替えたなど）、最初のタブに戻す
          if (!plant.views.some(v => v.key === this.selected[id])) this.selected[id] = defaultView(plant.views);
        }
        this.plants = state.plants;
        this.error = false;
        this.status = `最終更新 ${new Date().toLocaleTimeString("ja-JP")}（${REFRESH_MS / 1000} 秒ごとに更新）`;
        // 画面（canvas）が書き換わるのを待ってから、グラフを描き直す
        await this.$nextTick();
        this.plants.forEach(p => this.drawChart(p));
      } catch (e) {
        this.error = true;
        this.status = `読み込めません: ${e.message}`;
      }
    },

    // カードの一覧。株ごとに、今選んでいるタブの中身（view）を添える
    get cards() {
      return this.plants.map((plant, index) => ({
        plant, index,
        view: plant.found ? plant.views.find(v => v.key === this.selected[plant.plant_id]) : null,
      }));
    },

    // タブを押した。それ以降は自動で切り替えない（見たいタブを勝手に変えないため）
    pick(plant, key) {
      this.selected[plant.plant_id] = key;
      this.picked[plant.plant_id] = true;
      this.$nextTick(() => this.drawChart(plant));
    },

    // 株ごとの差し色（CSS の --k・--kl）
    accent(index) {
      const a = ACCENTS[index % ACCENTS.length];
      return `--k: ${a.k}; --kl: ${a.kl}`;
    },

    // 「〇〇さんのふたまる」。お客さんは「お客さんのふたまる」
    owner(view) {
      return view.person_id === null ? "お客さんのふたまる" : `${view.label}さんのふたまる`;
    },

    // ゲージ 1 本ぶん。0.5 から値の側へ棒を伸ばし、伸びた側の名前に色を付ける。
    // 例: 0.8 → 真ん中から右へ 30%、hi に色。0.5 ちょうどはどちらにも色を付けない
    gauge(value) {
      const v = Math.min(1, Math.max(0, value));
      const left = Math.min(v, 0.5), width = Math.abs(v - 0.5);
      return { style: `left: ${left * 100}%; width: ${width * 100}%`, hi: v > 0.505, lo: v < 0.495 };
    },

    // 「こんなふうに育てられた」の箇条書き。DB にある事実だけを並べる（原因のようには書かない）
    facts(growth) {
      const list = [];
      if (growth.interval_days !== null) {
        list.push(growth.interval_days <= 1.5
          ? "ほぼ毎日、会いに来てくれた"
          : `だいたい ${Math.round(growth.interval_days)} 日おきに会いに来てくれた`);
      }
      list.push(`1 回のお話で、平均 ${growth.avg_turns} 回話しかけてくれた`);
      if (growth.biggest_change) {
        const axis = AXES.find(a => a.key === growth.biggest_change.trait);
        const side = growth.biggest_change.delta > 0 ? axis.hi : axis.lo;
        list.push(`いちばん育ったのは「${side}」のところ`);
      }
      return list;
    },

    // 覚えていることの横に出す、種類と重要度（例: 「好み・重要度 0.8」）
    memoryTag(m) {
      return `${KIND[m.kind] || m.kind}・重要度 ${m.importance}`;
    },

    // くわしくの下の行（前回の会話・話し方・振り返った回数・今の値）
    metaRows(view) {
      return [
        ["前回の会話:", view.last_summary || "（まだありません）"],
        ["話し方:", DIALECT[view.dialect] || view.dialect],
        ["振り返った会話:", `${view.history.length - 1} 回`],
        ["今の値:", AXES.map(a => `${a.label} ${view.traits[a.key].toFixed(2)}`).join("　")],
      ];
    },

    // 成長曲線を描く。横軸は「初期」「1回目」「2回目」…（振り返りのたびに 1 点増える）
    drawChart(plant) {
      if (!plant.found) return;
      const canvas = document.getElementById(`chart-${plant.plant_id}`);
      if (!canvas) return;
      const view = plant.views.find(v => v.key === this.selected[plant.plant_id]);
      // canvas が作り直されていたら（株が一度消えて戻ったなど）、グラフも作り直す
      if (charts[plant.plant_id] && charts[plant.plant_id].canvas !== canvas) {
        charts[plant.plant_id].destroy();
        delete charts[plant.plant_id];
      }
      const chart = charts[plant.plant_id] || (charts[plant.plant_id] = newChart(canvas));
      // .map で作った普通の配列を渡す（Alpine.js の Proxy を Chart.js に渡さない）
      chart.data.labels = view.history.map((h, i) => (i === 0 ? "初期" : `${i}回目`));
      AXES.forEach((a, i) => { chart.data.datasets[i].data = view.history.map(h => h.traits[a.key]); });
      chart.update();
    },
  }));
});

// 成長曲線のグラフを 1 つ作る（中身は drawChart で入れる）
function newChart(canvas) {
  return new Chart(canvas, {
    type: "line",
    data: { labels: [], datasets: AXES.map(a => ({
      label: a.label, data: [], borderColor: a.color, backgroundColor: a.color,
      borderWidth: 2, pointRadius: 2, tension: 0.25 })) },
    options: {
      maintainAspectRatio: false, animation: { duration: 600 },
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { position: "bottom", labels: { boxWidth: 12, color: "#4a3426", font: { size: 12 } } },
                 tooltip: { callbacks: { title: items => items[0] && items[0].label } } },
      scales: { y: { min: 0, max: 1, ticks: { stepSize: 0.25, color: "#8a6a55" }, grid: { color: "#efe3d4" } },
                x: { ticks: { color: "#8a6a55" }, grid: { color: "#efe3d4" },
                     title: { display: true, text: "会話の回数", color: "#8a6a55" } } },
    },
  });
}
</script>
