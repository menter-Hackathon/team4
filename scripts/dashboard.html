<!doctype html>
<!--
  ふたまるのダッシュボード（仕様 §6.6、#59）。scripts/dashboard.py が返す HTML 1 枚。
  「ふたまる診断の結果画面」: 育てた人ごとに、どんな性格に育ったかを一発で見せる（設計メモ 2026-11-20）。
  しくみ:
    1. 数秒ごとに /api/state（JSON）を読みに行く
    2. 株ごとにカードを作り、上から
         結果（イラスト・タイプ名・キャッチコピー）→ せいかく（4 軸のゲージ）→ 説明文
         → こんなふうに育てられた（育て方の記録）→ くわしく（成長曲線・覚えていること・前回の会話）
       を描く
    3. 2 回目からは、部品を作り直さずに中身だけ入れ替える（ちらつかせないため）
  記憶や要約は LLM が作った文なので、HTML としてではなく必ず textContent で入れる（タグを実行させない）。
  色・線・丸ゴシックは、ちゃむさんのイラスト（クリーム色の鉢・茶色の太い線）に合わせている。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ふたまる ダッシュボード</title>
<!-- 丸ゴシック（Google Fonts）。読めないとき（ネットが無いなど）は、Mac・Windows にある字体で出す -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<!-- グラフ描画ライブラリ（外部の技術。README に記載）。版を固定する。成長曲線にだけ使う -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    /* イラストから取った色 */
    --bg: #f6f0e6;        /* 画面の地（鉢のクリーム色より少し暗い） */
    --paper: #fffaf1;     /* カードの地（鉢のクリーム色） */
    --ink: #4a3426;       /* 文字（イラストの線の茶色） */
    --line: #5b3a26;      /* 太い線 */
    --sub: #8a6a55;       /* 補足の文字 */
    --soft: #f1e6d8;      /* ゲージの溝・区切り */
    --cheek: #e58fa0;     /* ほっぺのピンク */
    --display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif;
    --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif;
  }
  * { box-sizing: border-box; }
  /* hidden を付けた部品は必ず隠す（display: grid などの指定より優先させる） */
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.7; }
  header {
    display: flex; align-items: baseline; gap: 6px 16px; flex-wrap: wrap;
    padding: 20px 24px 4px; max-width: 1240px; margin: 0 auto;
  }
  header h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 26px; color: var(--line); }
  header .status { color: var(--sub); font-size: 13px; }
  header .status.error { color: #b3261e; font-weight: bold; }
  main {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    gap: 20px; padding: 12px 24px 32px; max-width: 1240px; margin: 0 auto;
  }

  /* 株 1 つぶんのカード。--k が株ごとの差し色、--kl がその薄い色 */
  .card {
    background: var(--paper); border: 3px solid var(--line); border-radius: 30px;
    overflow: hidden; min-width: 0;
  }
  .card .bar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 3px solid var(--line); background: var(--paper);
  }
  .card .bar h2 { margin: 0; font-family: var(--display); font-size: 15px; color: var(--sub); font-weight: 700; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tabs button {
    font-family: var(--display); font-weight: 700;
    border: 2px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 2px 12px; font-size: 13px; cursor: pointer;
  }
  .tabs button.on { background: var(--k); color: #fff; }
  .tabs button:focus-visible { outline: 3px solid var(--cheek); outline-offset: 2px; }

  /* 1. 結果 */
  .result { background: var(--kl); text-align: center; padding: 14px 18px 18px; border-bottom: 3px solid var(--line); }
  .result .owner { font-family: var(--display); font-weight: 700; color: var(--sub); font-size: 15px; }
  .result .lead { font-size: 14px; }
  .result .pic {
    width: 200px; height: 200px; margin: 0 auto; display: flex; align-items: center; justify-content: center;
    font-size: 120px; line-height: 1;
  }
  .result .pic img { width: 200px; height: 200px; object-fit: contain; }
  .result .tname { font-family: var(--display); font-weight: 800; font-size: 32px; color: var(--line); line-height: 1.25; }
  .result .catch {
    display: inline-block; margin-top: 8px; background: #fff; border: 2px solid var(--line);
    border-radius: 999px; padding: 3px 16px; font-family: var(--display); font-weight: 700; font-size: 14px;
  }

  .body { padding: 16px 20px 22px; display: grid; gap: 18px; }
  h3 { margin: 0 0 6px; font-family: var(--display); font-size: 14px; color: var(--sub); letter-spacing: .04em; }

  /* 2. せいかく（4 軸のゲージ。真ん中 = 0.5 から、育った側へ棒が伸びる） */
  .axis {
    display: grid; grid-template-columns: 6em 1fr 6em; align-items: center; gap: 8px;
    font-family: var(--display); font-size: 14px; font-weight: 700; margin-top: 8px;
  }
  .axis .hi { text-align: right; }
  .axis span { color: #bba796; font-weight: 500; white-space: nowrap; }
  .axis span.on { color: var(--k); font-weight: 800; }
  .track { position: relative; height: 14px; background: var(--soft); border-radius: 99px; }
  .track::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: #d6c2ad; }
  .track i { position: absolute; top: 0; bottom: 0; background: var(--k); border-radius: 99px; transition: left .6s, width .6s; }

  /* 3. 説明文 */
  .detail { margin: 0; font-size: 15px; line-height: 1.9; }

  /* 4. こんなふうに育てられた */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stats div { background: var(--kl); border-radius: 16px; padding: 8px 6px; text-align: center; }
  .stats b { display: block; font-family: var(--display); font-size: 24px; color: var(--line); line-height: 1.3; font-variant-numeric: tabular-nums; }
  .stats small { font-size: 12px; color: var(--sub); }
  ul.facts { margin: 10px 0 0; padding-left: 1.2em; font-size: 14px; }
  .empty { color: var(--sub); font-size: 14px; }

  /* 5. くわしく */
  .more { border-top: 2px dashed var(--soft); padding-top: 14px; display: grid; gap: 14px; }
  .more .chart { position: relative; height: 230px; min-width: 0; }
  ol.mem { margin: 0; padding-left: 22px; font-size: 14px; line-height: 1.6; }
  ol.mem .tag { font-size: 11px; color: var(--sub); margin-left: 6px; white-space: nowrap; }
  .meta { font-size: 14px; line-height: 1.7; }
  .meta .k { color: var(--sub); margin-right: 6px; }
  .notfound { color: var(--sub); padding: 24px 20px; }

  @media (max-width: 720px) {
    header { padding: 16px 16px 4px; }
    main { grid-template-columns: 1fr; padding: 12px 16px 24px; }
    .result .pic, .result .pic img { width: 160px; height: 160px; }
    .result .tname { font-size: 26px; }
    .axis { grid-template-columns: 6em 1fr 6em; font-size: 12px; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) { .track i { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>ふたまるたちの育ったすがた</h1>
  <span id="status" class="status">読み込み中…</span>
</header>
<main id="plants"></main>

<script>
// 何秒ごとに読み直すか。デモで会話して眠らせた直後にゲージが動くのを見せるため短めにする
const REFRESH_MS = 3000;
// 性格 4 軸。hi は値が高い側（0.5 より上）、lo は低い側の呼び名。color は成長曲線の線の色
// 色は色覚の違いでも見分けやすい組み合わせ
const AXES = [
  { key: "talkativeness", label: "おしゃべり度", hi: "おしゃべり", lo: "ひかえめ", color: "#0072B2" },
  { key: "affection", label: "甘え度", hi: "あまえんぼ", lo: "クール", color: "#CC79A7" },
  { key: "energy", label: "元気度", hi: "げんき", lo: "まったり", color: "#E69F00" },
  { key: "curiosity", label: "好奇心", hi: "しりたがり", lo: "ききじょうず", color: "#009E73" },
];
const KIND = { preference: "好み", event: "出来事", habit: "習慣" };
const DIALECT = { standard: "標準語", kansai: "関西弁", hakata: "博多弁", hiroshima: "広島弁" };
// 株ごとの差し色（左: ひまわりのような暖色、右: 葉っぱの緑）と、その薄い色
const ACCENTS = [
  { k: "#d9822b", kl: "#fdf0d9" },
  { k: "#3f8f6c", kl: "#e3f2ea" },
];

// 株ごとの画面の部品と、選んでいる人（タブ）を覚えておく。{ plant_id: { card, line, selected, ... } }
const cards = {};

// 小さな要素を作る関数。文字は textContent で入れる（HTML として解釈させない）
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// 1 株ぶんのカードを最初に 1 回だけ作る
function createCard(plant, index) {
  const accent = ACCENTS[index % ACCENTS.length];
  const card = el("section", "card");
  card.style.setProperty("--k", accent.k);
  card.style.setProperty("--kl", accent.kl);

  // 上の帯: 株の名前とタブ（お客さん・人ごと）
  const bar = el("div", "bar");
  const title = el("h2");
  const tabs = el("div", "tabs");
  bar.append(title, tabs);

  // 1. 結果
  const result = el("div", "result");
  const owner = el("div", "owner"), lead = el("div", "lead");
  const pic = el("div", "pic");
  const tname = el("div", "tname"), ctch = el("div", "catch");
  result.append(owner, lead, pic, tname, ctch);

  const body = el("div", "body");
  // 2. せいかく。ゲージは最初に 4 本作り、あとは棒の位置と色だけ変える
  const traits = el("section");
  traits.append(el("h3", null, "せいかく"));
  const gauges = AXES.map(a => {
    const row = el("div", "axis");
    const hi = el("span", "hi", a.hi), lo = el("span", "lo", a.lo);
    const track = el("div", "track"), fill = el("i");
    track.append(fill);
    row.append(hi, track, lo);
    traits.append(row);
    return { hi, lo, fill };
  });
  // 3. 説明文
  const detail = el("p", "detail");
  // 4. こんなふうに育てられた
  const growth = el("section");
  growth.append(el("h3", null, "こんなふうに育てられた"));
  const growthBody = el("div");
  growth.append(growthBody);
  // 5. くわしく（今までのダッシュボードにあった情報）
  const more = el("section", "more");
  more.append(el("h3", null, "くわしく"));
  const chartBox = el("div", "chart"), lineCanvas = el("canvas");
  chartBox.append(lineCanvas);
  more.append(chartBox);
  more.append(el("h3", null, "覚えていること（大事で新しい順・上位10件）"));
  const mem = el("div");
  more.append(mem);
  const meta = el("div", "meta");
  more.append(meta);

  body.append(traits, detail, growth, more);
  const notfound = el("div", "notfound");
  card.append(bar, result, body, notfound);
  document.getElementById("plants").append(card);

  // 成長曲線: 会話（振り返り）ごとの 4 軸の値
  const line = new Chart(lineCanvas, {
    type: "line",
    data: { labels: [], datasets: AXES.map(a => ({
      label: a.label, data: [], borderColor: a.color, backgroundColor: a.color,
      borderWidth: 2, pointRadius: 2, tension: 0.25 })) },
    options: {
      maintainAspectRatio: false, animation: { duration: 600 },
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { position: "bottom", labels: { boxWidth: 12, color: "#4a3426", font: { size: 12 } } },
                 tooltip: { callbacks: { title: items => items[0] && items[0].label } } },
      scales: { y: { min: 0, max: 1, ticks: { stepSize: 0.25, color: "#8a6a55" }, grid: { color: "#efe3d4" } },
                x: { ticks: { color: "#8a6a55" }, grid: { color: "#efe3d4" },
                     title: { display: true, text: "会話の回数", color: "#8a6a55" } } },
    },
  });
  return { card, title, tabs, result, owner, lead, pic, tname, ctch, body, gauges, detail,
           growthBody, mem, meta, notfound, line, selected: "guest" };
}

// タイプのイラスト。あれば画像、無ければ絵文字。
// 3 秒ごとに画像を作り直すとちらつくので、表示する中身が変わったときだけ入れ替える
function renderPic(c, type) {
  const shown = type.image || type.emoji;
  if (c.pic.dataset.shown === shown) return;
  c.pic.dataset.shown = shown;
  if (type.image) {
    const img = el("img");
    img.src = type.image;  // サーバーが返した /types/<英語名>.png だけを使う
    img.alt = type.name;
    c.pic.replaceChildren(img);
  } else {
    c.pic.textContent = type.emoji;
  }
}

// ゲージ 1 本。0.5 から値の側へ棒を伸ばし、伸びた側の名前に色を付ける。
// 例: 0.8 → 真ん中から右へ 30%、「おしゃべり」に色。0.5 ちょうどはどちらにも色を付けない
function renderGauge(g, value) {
  const v = Math.min(1, Math.max(0, value));
  const left = Math.min(v, 0.5), width = Math.abs(v - 0.5);
  g.fill.style.left = `${left * 100}%`;
  g.fill.style.width = `${width * 100}%`;
  g.hi.classList.toggle("on", v > 0.505);
  g.lo.classList.toggle("on", v < 0.495);
}

// 「こんなふうに育てられた」。DB にある事実だけを並べる（原因のようには書かない、設計メモ 2026-11-20）
function renderGrowth(c, growth) {
  c.growthBody.replaceChildren();
  if (growth.talks === 0) {
    c.growthBody.append(el("div", "empty", "まだお話ししていません"));
    return;
  }
  const stats = el("div", "stats");
  const tile = (value, label) => {
    const d = el("div");
    d.append(el("b", null, value), el("small", null, label));
    return d;
  };
  stats.append(
    tile(String(growth.talks), "回お話しした"),
    tile(String(growth.waterings), "回お水をもらった"),
    tile(growth.time_band, "によく話しかけてくれた"),
  );
  const facts = el("ul", "facts");
  if (growth.interval_days !== null) {
    facts.append(el("li", null, growth.interval_days <= 1.5
      ? "ほぼ毎日、会いに来てくれた"
      : `だいたい ${Math.round(growth.interval_days)} 日おきに会いに来てくれた`));
  }
  facts.append(el("li", null, `1 回のお話で、平均 ${growth.avg_turns} 回話しかけてくれた`));
  if (growth.biggest_change) {
    const axis = AXES.find(a => a.key === growth.biggest_change.trait);
    const side = growth.biggest_change.delta > 0 ? axis.hi : axis.lo;
    facts.append(el("li", null, `いちばん育ったのは「${side}」のところ`));
  }
  c.growthBody.append(stats, facts);
}

// 選んでいる人の内容をカードに入れる
function renderView(c, plant, view) {
  // 1. 結果
  c.owner.textContent = view.person_id === null ? "お客さんのふたまる" : `${view.label}さんのふたまる`;
  c.lead.textContent = `${view.days} 日育てた結果…`;
  renderPic(c, view.type);
  c.tname.textContent = view.type.name;
  c.ctch.textContent = view.type.description;
  // 2. せいかく
  AXES.forEach((a, i) => renderGauge(c.gauges[i], view.traits[a.key]));
  // 3. 説明文
  c.detail.textContent = view.type.detail;
  // 4. こんなふうに育てられた
  renderGrowth(c, view.growth);
  // 5. くわしく: 成長曲線。横軸は「初期」「1回目」「2回目」…（振り返りのたびに 1 点増える）
  c.line.data.labels = view.history.map((h, i) => (i === 0 ? "初期" : `${i}回目`));
  AXES.forEach((a, i) => { c.line.data.datasets[i].data = view.history.map(h => h.traits[a.key]); });
  c.line.update();
  // 覚えていること
  c.mem.replaceChildren();
  if (view.memories.length === 0) {
    c.mem.append(el("div", "empty", "まだ何も覚えていません"));
  } else {
    const ol = el("ol", "mem");
    for (const m of view.memories) {
      const li = el("li", null, m.content);
      li.append(el("span", "tag", `${KIND[m.kind] || m.kind}・重要度 ${m.importance}`));
      ol.append(li);
    }
    c.mem.append(ol);
  }
  // 前回の会話・方言・振り返った回数・今の値
  c.meta.replaceChildren();
  const row = (k, v) => {
    const d = el("div");
    d.append(el("span", "k", k), document.createTextNode(v));
    return d;
  };
  c.meta.append(
    row("前回の会話:", view.last_summary || "（まだありません）"),
    row("話し方:", DIALECT[view.dialect] || view.dialect),
    row("振り返った会話:", `${view.history.length - 1} 回`),
    row("今の値:", AXES.map(a => `${a.label} ${view.traits[a.key].toFixed(2)}`).join("　")),
  );
}

// 最初に開くタブを決める。views は先頭がお客さん、続いて登録された人（dashboard.py の plant_state）。
// 例: [お客さん, ショーン] → ショーンのタブ、[お客さん] や [お客さん, たろう, はなこ] → お客さんのタブ
function defaultView(views) {
  return views.length === 2 ? views[1].key : "guest";
}

// 株 1 つぶんを描く（タブ = お客さんと、知っている人）
function renderPlant(plant, index) {
  const c = cards[plant.plant_id] || (cards[plant.plant_id] = createCard(plant, index));
  if (!plant.found) {
    c.title.textContent = plant.plant_id;
    c.notfound.textContent = "この株はまだ DB にありません（一度起こすと作られます）";
    c.result.hidden = true;
    c.body.hidden = true;
    c.tabs.replaceChildren();
    c.tabKeys = "";
    return;
  }
  c.notfound.textContent = "";
  c.result.hidden = false;
  c.body.hidden = false;
  c.title.textContent = `${plant.name}（${plant.plant_id}）`;
  const views = plant.views;
  // 最初に開くタブ。まだ誰もタブを押していない間は、登録されている人が 1 人だけの株なら
  // その人のタブ、それ以外はお客さん（株の性格）のタブにする。
  // デモでは「a1 はショーンさん、b1 はちゃむさんのふたまる」と 1 株に 1 人が育てるので、
  // 開いた直後からその人が育てた結果を見せるため。
  // 開いたあとに人が登録されたときも、タブを押していなければ自動で切り替える
  if (!c.picked) c.selected = defaultView(views);
  // 選んでいた人がいなくなっていたら（DB を替えたなど）、最初のタブに戻す
  if (!views.some(v => v.key === c.selected)) c.selected = defaultView(views);
  c.plant = plant;  // タブを押したときは、最後に読んだ内容で描き直す
  // タブのボタンは、人の顔ぶれが変わったときだけ作り直す（毎回作り直すと押した瞬間に消えることがある）
  const keys = views.map(v => v.key + ":" + v.label).join("|");
  if (c.tabKeys !== keys) {
    c.tabKeys = keys;
    c.tabs.replaceChildren(...views.map(v => {
      const b = el("button", null, v.person_id === null ? "お客さん" : v.label);
      b.dataset.key = v.key;
      // 押したら、それ以降は自動で切り替えない（見たいタブを勝手に変えないため）
      b.onclick = () => { c.selected = v.key; c.picked = true; renderPlant(c.plant, index); };
      return b;
    }));
  }
  for (const b of c.tabs.children) b.classList.toggle("on", b.dataset.key === c.selected);
  renderView(c, plant, views.find(v => v.key === c.selected));
}

// /api/state を読んで画面を描き直す。失敗しても次の回にまた試す
async function refresh() {
  const status = document.getElementById("status");
  try {
    const res = await fetch("/api/state", { cache: "no-store" });
    const state = await res.json();
    if (state.error) throw new Error(state.error);
    state.plants.forEach(renderPlant);
    status.className = "status";
    status.textContent = `最終更新 ${new Date().toLocaleTimeString("ja-JP")}（${REFRESH_MS / 1000} 秒ごとに更新）`;
  } catch (e) {
    status.className = "status error";
    status.textContent = `読み込めません: ${e.message}`;
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
