# ふたまるの「脳」をまとめて起動する compose ファイル（設計: docs/superpowers/specs/2026-11-16-docker-backend-design.md）
#
#   docker compose up -d       … 起動（初回はモデルのダウンロードで時間がかかる）
#   docker compose logs -f agent  … エージェントのログを見る
#   docker compose down        … 停止
#
# 手順書: docs/deploy.md
# 前提: NVIDIA の GPU が 2 枚ある PC（LLM 用に 12GB 以上、STT 用に 8GB 以上。例: RTX 5070 と RTX 5060）。
#       鉢（ESP32）とは LiveKit Cloud 経由でつながる。
#
# 中身:
#   llm      … Gemma 4 E4B の圧縮版を動かす（Ollama、GPU を 1 枚使う。.env の LLM_GPU）
#   llm-init … 起動時に一度だけ動き、llm に Gemma 4 をダウンロード・GPU に読み込みさせて終わる
#   stt      … kotoba-whisper で声を文字にする（Speaches、もう 1 枚の GPU を使う。.env の STT_GPU）
#   stt-init … 起動時に一度だけ動き、stt に音声認識のモデルをダウンロード・読み込みさせて終わる
#   tts      … AivisSpeech Engine で植物の声を作る（CPU を使う。.env で TTS_PROVIDER=aivis のときに使われる）
#   tts-init … 起動時に一度だけ動き、tts に声のモデル（らせつんなど）を AivisHub から入れて読み込ませて終わる
#   agent    … ふたまるのエージェント。llm-init・stt-init・tts-init の完了を待ってから起動する
#   dashboard … 性格・成長・記憶を見せる画面。この PC のブラウザで http://127.0.0.1:8765 を開く

# GPU の分け方（2026-11-18、#37）:
#   デモの PC（ショーンさんの PC）は RTX 5070（12GB）と RTX 5060（8GB）。1 枚で 24GB 以上の GPU は無い。
#   そこで、LLM と STT に GPU を 1 枚ずつ割り当てて、メモリを取り合わないようにする。
#   どの GPU を使うかは、nvidia-smi の左端の番号（0 か 1）で .env の LLM_GPU・STT_GPU に書く。
#   空なら LLM が 0 番、STT が 1 番。LLM はメモリの大きいほう（RTX 5070）にする

services:
  llm:
    # Ollama 公式イメージ。版を固定する（2026-11-18 に Mac で Gemma 4 を確かめたのと同じ版）
    # なぜ vLLM ではなく Ollama か:
    #   vLLM で圧縮していない Gemma 4 E4B を動かすと、重みだけで約 16GB あり、12GB の GPU に載らない。
    #   Ollama の圧縮版（q4_K_M、約 6.6GB）なら RTX 5070（12GB）に、会話の作業用メモリごと収まる
    image: ollama/ollama:0.40.16
    environment:
      # 読み込んだモデルを外さない（外すと、次の返事で読み込み直しの待ちが出る）
      OLLAMA_KEEP_ALIVE: "-1"
      # 同時に 2 つまで処理する（眠ったあとの振り返りと、次の会話の返事が重なっても待たせないため）
      OLLAMA_NUM_PARALLEL: "2"
      # 一度に扱える文章の長さ（トークン）。既定の 4096 だと、記憶が多いプロンプトと長い会話で
      # 古い部分（システムプロンプトを含む）が切り捨てられることがあるので、8192 にする
      OLLAMA_CONTEXT_LENGTH: "8192"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LLM_GPU:-0}"]
              capabilities: [gpu]
    volumes:
      # ダウンロードしたモデルを残し、2 回目からはダウンロードしない
      - ollama-models:/root/.ollama
    restart: unless-stopped

  llm-init:
    # エージェントのイメージの元と同じ python:3.12-slim で scripts/llm_init.py を動かす（標準ライブラリだけで動く）。
    # 1. llm が起動するまで待つ
    # 2. Gemma 4 の圧縮版をダウンロードさせる（初回だけ、約 6.6GB）
    # 3. 一度呼んで GPU に読み込ませ、全部 GPU に載ったかをログに出す
    # 成功したら終わる。失敗したらエラーで止まり、agent は起動しない
    image: python:3.12-slim
    command: ["python", "/llm_init.py"]
    environment:
      OLLAMA_URL: http://llm:11434
      LLM_MODEL: ${DOCKER_LLM_MODEL:-gemma4:e4b-it-q4_K_M}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./scripts/llm_init.py:/llm_init.py:ro
    depends_on:
      - llm
    restart: "no"

  stt:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${STT_GPU:-1}"]
              capabilities: [gpu]
    # Speaches 公式イメージ（CUDA 版）
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cuda
    environment:
      # モデルを使い終わっても外さない（外すと次の発話の文字起こしが遅くなる）
      STT_MODEL_TTL: "-1"
    volumes:
      - speaches-cache:/home/ubuntu/.cache/huggingface/hub
    restart: unless-stopped

  stt-init:
    # stt と同じイメージ（ダウンロード済み）の Python で scripts/stt_init.py を動かす。
    # 1. モデルのダウンロードを頼む（stt が起動するまで最大 10 分ほど再試行）
    # 2. 無音を一度文字起こしさせて、モデルを GPU に読み込ませる（最初の「ふたまる」が遅れないように）
    # 成功したら終わる。失敗したらエラーで止まり、agent は起動しない
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cuda
    entrypoint: ["python", "/stt_init.py"]
    command: []
    environment:
      STT_URL: http://stt:8000
      STT_MODEL: ${DOCKER_STT_MODEL:-kotoba-tech/kotoba-whisper-v2.0-faster}
    volumes:
      - ./scripts/stt_init.py:/stt_init.py:ro
    depends_on:
      - stt
    restart: "no"

  tts:
    # AivisSpeech Engine 公式イメージ（CPU 版）。版を固定する。
    # CPU にするのは、GPU のメモリを llm（8 割）と stt で使い切るため。短い文なら CPU でも 1 秒前後で声になる
    # （2026-11-18、M5 の Mac で 11 字 0.7 秒）
    image: ghcr.io/aivis-project/aivisspeech-engine:cpu-1.2.0
    # 声のモデルを置くフォルダ（ボリューム）は、最初は root の持ち物として作られる。
    # AivisSpeech は user というユーザーで動くので、そのままだとモデルを保存できない。
    # そこで起動の前に、フォルダの持ち主を user に変えてから、公式と同じコマンドで起動する
    entrypoint:
      - bash
      - -c
      - >-
        chown -R user /home/user/.local/share/AivisSpeech-Engine-Dev &&
        exec gosu user .venv/bin/python ./run.py --host 0.0.0.0
    volumes:
      # 入れた声のモデルを残し、2 回目からはダウンロードしない
      - aivis-data:/home/user/.local/share/AivisSpeech-Engine-Dev
    restart: unless-stopped

  tts-init:
    # エージェントのイメージの元と同じ python:3.12-slim で scripts/tts_init.py を動かす（標準ライブラリだけで動く）。
    # 1. .env の TTS_PROVIDER が aivis でなければ、何もせずに終わる（声が OpenAI なら AivisSpeech は要らない）
    # 2. AIVIS_MODELS のモデルが入っていなければ、AivisHub から入れる
    # 3. AIVIS_SPEAKER の声が入っているか確かめ、一度読み上げて読み込ませる
    # 成功したら終わる。失敗したらエラーで止まり、agent は起動しない
    image: python:3.12-slim
    command: ["python", "/tts_init.py"]
    environment:
      TTS_PROVIDER: ${TTS_PROVIDER:-openai}
      AIVIS_URL: http://tts:10101
      # 入れておく声のモデルの UUID（カンマ区切り）。既定はらせつん。
      # まお・コハクは AivisSpeech に最初から入っているので書かなくてよい
      AIVIS_MODELS: ${AIVIS_MODELS:-9f36ec0d-8dac-42dc-aff4-149c5f99faad}
      # 植物の声のスタイル ID。空なら agent と同じ既定（893625030 =「らせつん / 標準２」、agent/config.py）
      AIVIS_SPEAKER: ${AIVIS_SPEAKER:-893625030}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./scripts/tts_init.py:/tts_init.py:ro
    depends_on:
      - tts
    restart: "no"

  agent:
    build: .
    # キー類（LiveKit・OpenAI）は .env から読む
    env_file: .env
    # LLM・STT の場所は、.env の値（開発用に OpenAI を向けていても）より、こちらを優先する
    environment:
      LLM_BASE_URL: http://llm:11434/v1
      LLM_MODEL: ${DOCKER_LLM_MODEL:-gemma4:e4b-it-q4_K_M}
      LLM_API_KEY: ollama
      # Ollama の Gemma 4 は、何も言わないと思考モードで動いて遅くなるので切る（#54）
      LLM_REASONING_EFFORT: none
      STT_BASE_URL: http://stt:8000/v1
      STT_MODEL: ${DOCKER_STT_MODEL:-kotoba-tech/kotoba-whisper-v2.0-faster}
      STT_API_KEY: EMPTY
      # 声を AivisSpeech にするとき（.env の TTS_PROVIDER=aivis）は、コンテナの tts を使う
      AIVIS_BASE_URL: http://tts:10101
      FUTAMARU_DB_PATH: /app/data/futamaru.db
      # console 専用の設定なので、コンテナでは空にする
      DEV_PLANT_ID: ""
    volumes:
      # 会話ログ・記憶の DB をホストの ./data に残す（コンテナを作り直しても植物の記憶が消えない）
      - ./data:/app/data
    depends_on:
      llm-init:
        condition: service_completed_successfully
      stt-init:
        condition: service_completed_successfully
      tts-init:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    # エージェントと同じイメージ（同じ Dockerfile から作る。2 回目のビルドはキャッシュで一瞬で終わる）
    build: .
    # DB は読むだけ。エージェントが動いている最中でも開ける（scripts/dashboard.py）
    # --host 0.0.0.0: コンテナの中では、外（PC 側）からの接続を受け付ける。
    #   コンテナの中の 127.0.0.1 には PC のブラウザから届かないため。
    #   その代わり、下の ports で PC 側の公開を 127.0.0.1 に絞り、ほかの PC からは開けないようにする
    #   （会話の記憶が見えるため、仕様 §6.6）
    # DASHBOARD_PLANTS: 並べる株（カンマ区切り、.env で変えられる。空なら a1,b1）
    command:
      - python
      - -m
      - scripts.dashboard
      - --db
      - /app/data/futamaru.db
      - --plants
      - ${DASHBOARD_PLANTS:-a1,b1}
      - --host
      - 0.0.0.0
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  ollama-models:
  speaches-cache:
  aivis-data:
